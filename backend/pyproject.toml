[project]
name = "fake-detect-backend"
version = "0.1.0"
description = "Local AI-image detection API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pillow>=10.4",
    "numpy>=1.26,<2.0",
    "opencv-python-headless>=4.10",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.44",
    "timm>=1.0",
    "piexif>=1.1.3",
    "huggingface-hub>=0.24",
    "pydantic>=2.9",
    "c2pa-python>=0.37",
    "diffusers>=0.30",
    "lpips>=0.1.4",
    "peft>=0.13",
]

[tool.uv]
package = false
